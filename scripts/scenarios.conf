# =============================================================================
# Network scenario matrix (source this file; do not execute it)
# =============================================================================
# Each scenario is applied to Caddy's client-facing interface by docker-tc as
# a Linux `netem` rule: delay + jitter + packet loss + bandwidth rate.
#
# Values follow the thesis methodology table exactly. Where the methodology
# states a RANGE, the midpoint (or a representative value inside the range) is
# used and documented here so the choice is reproducible:
#
#   S1 Baseline (Ideal)          : range 0-5 ms  -> 2 ms (midpoint), no loss
#   S3 Congested 4G              : loss 2-3%     -> 2.5% (midpoint)
#   S5 Long Distance (High Lat.) : delay 250-300 -> 275 ms (midpoint)
# =============================================================================

SCENARIOS="S1 S2 S3 S4 S5"

# S1 - Baseline (Ideal): 100 Mbps, 0-5 ms, 0% loss, 0 ms jitter
S1_RATE="100mbit"
S1_DELAY="2ms"
S1_JITTER="0ms"
S1_LOSS="0%"
S1_DESC="Baseline (Ideal)"

# S2 - Stable 4G: 20 Mbps, 40 ms, 0% loss, 5 ms jitter
S2_RATE="20mbit"
S2_DELAY="40ms"
S2_JITTER="5ms"
S2_LOSS="0%"
S2_DESC="Stable 4G"

# S3 - Congested 4G: 10 Mbps, 100 ms, 2-3% loss, 15 ms jitter
S3_RATE="10mbit"
S3_DELAY="100ms"
S3_JITTER="15ms"
S3_LOSS="2.5%"
S3_DESC="Congested 4G"

# S4 - Slow 4G / Fast 3G: 1.6 Mbps, 150 ms, 0.5% loss, 10 ms jitter
S4_RATE="1600kbit"
S4_DELAY="150ms"
S4_JITTER="10ms"
S4_LOSS="0.5%"
S4_DESC="Slow 4G / Fast 3G"

# S5 - Long Distance (High Latency): 10 Mbps, 250-300 ms, 1% loss, 20 ms jitter
S5_RATE="10mbit"
S5_DELAY="275ms"
S5_JITTER="20ms"
S5_LOSS="1%"
S5_DESC="Long Distance (High Latency)"
