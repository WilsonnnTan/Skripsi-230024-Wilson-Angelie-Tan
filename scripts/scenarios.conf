# =============================================================================
# Network scenario matrix (source this file; do not execute it)
# =============================================================================
# Applied by docker-tc to EACH h2load container (thesis Sec. 3.2), symmetrically:
# egress + ingress (via ifb). Therefore:
#     *_DELAY is ONE-WAY.   Effective RTT = 2 x *_DELAY.
#     *_LOSS is applied on BOTH directions (same convention as Trevisan et al. 2021
#     for loss; Liu et al. 2024 "two-way loss and delay").
#
# Tags (match Tabel 3.3 and the paragraphs in Sec. 3.3.4):
#   [SRC]    = value (or equivalent RTT) appears in a cited source
#   [DESIGN] = author's design choice, declared as such in the thesis
#
# Sources cited in the thesis text:
#   Trevisan 2021  : extra latency 50/100/200 ms; loss 1/2/5 %;
#                    bandwidth 5/2/1 Mbit/s; "Native" baseline = 1 Gbit/s campus
#   Liu 2024       : fixed 10 Mbit/s; loss 0/2/4 %; delay 0/25/50 ms
#   Saif 2021      : 300 ms fixed delay + loss up to 1.4 % (unstable beyond)
#   Gupta 2022     : measured latency ~230 ms (India -> US East, ~7500 miles)
#   Lighthouse     : 150 ms RTT, 1.6 Mbps down / 0.75 Mbps up, no loss
#   WebPageTest    : FIOS 4 ms RTT; LTE 12 Mbps / 70 ms RTT; 3G Fast 1.6 Mbps / 150 ms RTT
#   Wolsing 2019   : LTE profile 74 ms RTT, 0 % loss
#   Huang 2013     : handshake RTT median 70 ms; median downlink retransmission 0.06 %
#   Albaladejo 2015: LTE loss < 0.35 %; bandwidth ~10-20 Mbps; RTT std-dev ~0-50 ms
#
# Jitter is a [DESIGN] choice in S2, S3, S5 (kept within the Albaladejo RTT std-dev
# range). S1 and S4 use 0 ms because their source profiles contain no jitter.
#
# NOTE: an empty *_RATE means NO bandwidth limit. The script that applies these
# values must skip the rate/tbf setting when *_RATE is empty.
# =============================================================================

SCENARIOS="S1 S2 S3 S4 S5"

# S1 - Baseline (no impairment): RTT 4 ms, 0 % loss, no bandwidth limit
#   RTT 4 ms = WebPageTest FIOS; zero-impairment control = Trevisan "Native".
#   No source exists for any specific bandwidth, so none is applied.
S1_RATE=""            # no limit
S1_DELAY="2ms"        # RTT 4 ms   [SRC: WebPageTest FIOS]
S1_JITTER="0ms"       # [SRC: none in profile]
S1_LOSS="0%"          # [SRC: Trevisan Native]
S1_DESC="Baseline (tanpa gangguan)"

# S2 - Stable 4G/LTE: RTT 70 ms, 20 Mbit, 0 % loss
#   RTT 70 ms = WebPageTest LTE = Huang median; Wolsing LTE 74 ms.
#   20 Mbit = upper end of ~10-20 Mbps observed by Albaladejo.
#   0 % loss: Huang (0.06 % median), Albaladejo (< 0.35 %).
S2_RATE="20mbit"      # [SRC: Albaladejo range]
S2_DELAY="35ms"       # RTT 70 ms  [SRC]
S2_JITTER="5ms"       # [DESIGN]
S2_LOSS="0%"          # [SRC]
S2_DESC="4G stabil"

# S3 - Lossy path (NOT "Congested 4G"): RTT 100 ms, 10 Mbit, 2 % loss
#   Measured LTE loss is far below 1 % (Huang; Albaladejo), so this is not claimed as 4G.
#   2 % loss tested by Trevisan and Liu; 10 Mbit = Liu (fixed); RTT 100 ms = Trevisan.
#   Combination of tested levels, not one paper's profile.
S3_RATE="10mbit"      # [SRC: Liu]
S3_DELAY="50ms"       # RTT 100 ms [SRC: Trevisan]
S3_JITTER="15ms"      # [DESIGN]
S3_LOSS="2%"          # [SRC: Trevisan, Liu]
S3_DESC="Jalur dengan packet loss (2%)"

# S4 - Slow 4G / Fast 3G: Lighthouse / WebPageTest 3G Fast preset
#   1.6 Mbps, 150 ms RTT, no packet loss, no jitter in the source profile.
S4_RATE="1600kbit"    # [SRC: Lighthouse; WebPageTest 3G Fast]
S4_DELAY="75ms"       # RTT 150 ms [SRC]
S4_JITTER="0ms"       # [SRC: none in preset]
S4_LOSS="0%"          # [SRC: no packet loss in preset]
S4_DESC="4G lambat / 3G cepat"

# S5 - Long distance (high RTT): RTT 230 ms, 10 Mbit, 1 % loss
#   RTT 230 ms = Gupta & Bartos measured latency India -> US East.
#   1 % loss: Trevisan 1 %; Saif stable up to 1.4 % at 300 ms.
#   10 Mbit = Liu (fixed).
#   Harsher variant (optional): RTT 300 ms (Saif) -> S5_DELAY="150ms".
S5_RATE="10mbit"      # [SRC: Liu]
S5_DELAY="115ms"      # RTT 230 ms [SRC: Gupta & Bartos]
S5_JITTER="20ms"      # [DESIGN]
S5_LOSS="1%"          # [SRC: Trevisan, Saif]
S5_DESC="Jarak jauh (RTT tinggi)"