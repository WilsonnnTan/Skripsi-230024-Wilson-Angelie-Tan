# =============================================================================
# Research Testbed: HTTP/1.1 vs HTTP/2 vs HTTP/3 on a REST API
# -----------------------------------------------------------------------------
# Topology (see README for the ASCII architecture diagram):
#   h2load x10 --(edge_net)--> Caddy --(backend_net)--> backend (Express)
#   docker-tc attaches symmetric netem/tbf rules to EACH h2load container's
#   *edge* interface (per-client link emulation), not to Caddy.
#   cAdvisor -> Prometheus; h2load-exporter -> Prometheus; Grafana -> Prometheus.
#
# All resource limits follow the methodology table so that the load generators
# never compete with the server for CPU/RAM (measurement bias control).
#
# Requires: Docker Engine + Docker Compose v2.20+ on a LINUX host
#           (docker-tc/netem/nsenter/ifb are Linux-only).
# =============================================================================
name: http-testbed

# --------------------------------------------------------------------------- #
# Reusable resource limit anchors
# --------------------------------------------------------------------------- #
# We use the classic `cpus` / `mem_limit` keys because Docker Compose enforces
# them for BOTH `docker compose up` and `docker compose run` (the campaign uses
# `run`). They encode the methodology limits exactly:
#   backend 1 vCPU / 1 GB, caddy 1 vCPU / 1 GB, docker-tc 1 vCPU / 0.5 GB,
#   and each of the 10 h2load loaders 0.25 vCPU / 256 MB (2.5 vCPU total).
# --------------------------------------------------------------------------- #
x-limits-backend: &limits-backend
  cpus: "1.0"
  mem_limit: 1g

x-limits-caddy: &limits-caddy
  cpus: "1.0"
  mem_limit: 1g

x-limits-docker-tc: &limits-docker-tc
  cpus: "1.0"
  mem_limit: 512m

x-limits-h2load: &limits-h2load
  cpus: "0.25"
  mem_limit: 256m

services:
  # ------------------------------------------------------------------------- #
  # 1. Application server: single static GET endpoint, no DB, no I/O.
  # ------------------------------------------------------------------------- #
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: http-testbed/backend:latest
    container_name: backend
    <<: *limits-backend
    # Batasan #2: pin the system-under-test to Performance cores only (never
    # E-cores). Defaults target an i7-12650H where logical CPUs 0-11 are the
    # P-core threads. VERIFY on your host with `lscpu -e` (inside WSL2 if on
    # Windows) and override CPUSET_* in .env. See .env.example for the WSL2
    # caveat: docker cpuset alone does not pin the WSL2 VM to host P-cores.
    cpuset: "${CPUSET_BACKEND:-0-1}"
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # 2. Caddy: TLS termination + 3 isolated protocol listeners.
  #    8443 = HTTP/1.1 only (TCP)
  #    8444 = HTTP/2 only   (TCP)
  #    8445 = HTTP/3 only   (QUIC over UDP)
  #    All three reverse-proxy to backend:3000 over plain internal HTTP.
  # ------------------------------------------------------------------------- #
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    <<: *limits-caddy
    # System-under-test: pin to P-cores (see backend). Distinct from backend's
    # set so the two never share a core during measurement.
    cpuset: "${CPUSET_CADDY:-2-3}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8443:8443"       # HTTP/1.1
      - "8444:8444"       # HTTP/2
      - "8445:8445"       # HTTP/3 (TCP fallback / diagnostics)
      - "8445:8445/udp"   # HTTP/3 (QUIC -- MUST be open on the host firewall)
      - "2019:2019"       # Caddy admin API + /metrics (debugging only)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge_net
      - backend_net
      - monitoring_net
    healthcheck:
      # Admin API answers on :2019 once the server has loaded the config.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # 3. docker-tc: network emulation controller (bandwidth/delay/jitter/loss).
  #    Runs on the HOST network + host PID namespace so it can `nsenter` into
  #    each h2load container's network namespace and call `tc`. Controlled via
  #    REST API :4080. Now shapes the LOADERS (per-client link), not Caddy, and
  #    emulates BOTH directions (egress netem + ingress via an ifb mirror).
  #    NOTE: the upstream lukaszlach/docker-tc image cannot emulate *jitter* or
  #    ingress, so this project ships an API-compatible extended image (docker-tc/).
  # ------------------------------------------------------------------------- #
  docker-tc:
    build:
      context: ./docker-tc
      dockerfile: Dockerfile
    image: http-testbed/docker-tc:latest
    container_name: docker-tc
    <<: *limits-docker-tc
    # Support plane: kept off the SUT cores so netem control never contends
    # with backend/caddy/loaders.
    cpuset: "${CPUSET_SUPPORT:-8-11}"
    network_mode: host
    pid: host
    privileged: true
    environment:
      HTTP_PORT: "4080"
      HTTP_BIND: "0.0.0.0"
      # Default target is unused (the campaign posts to each loader by name),
      # but kept for ad-hoc GET/DELETE convenience.
      TARGET_CONTAINER: "caddy"
      EDGE_SUBNET_PREFIX: "172.28."
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4080/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # 4. h2load: load-generator TEMPLATE. The campaign launches 10 instances of
  #    this service per run with `docker compose run -d --name h2load_run_<i>`,
  #    one process per container. A single h2load binary (built with HTTP/3)
  #    drives all three protocols — the protocol is chosen per-run via env.
  #    Hidden behind the `loadgen` profile so a plain `docker compose up` never
  #    starts it; `docker compose run` ignores the profile.
  # ------------------------------------------------------------------------- #
  h2load:
    build:
      context: ./h2load
      dockerfile: Dockerfile
    image: http-testbed/h2load:latest
    profiles: ["loadgen"]
    <<: *limits-h2load
    # All 10 loaders share the load-generator cores (0.25 vCPU quota each keeps
    # them within 2.5 vCPU total, off the SUT cores).
    cpuset: "${CPUSET_LOADER:-4-7}"
    # Parameters (TARGET_URL, PROTOCOL, LOG_FILE, CLIENTS, STREAMS, PRESTART,
    # DURATION) are injected per-run by scripts/run_experiments.sh.
    volumes:
      - ./results:/results
    networks:
      - edge_net
    restart: "no"

  # ------------------------------------------------------------------------- #
  # 4b. h2load-exporter: tails the per-request logs of the 10 loaders for the
  #     run in progress and exposes rolling client-side metrics (throughput,
  #     error rate, p50/p90/p95/p99) for Prometheus to scrape — the live view
  #     h2load cannot remote-write itself. Server CPU/mem stay on cAdvisor.
  # ------------------------------------------------------------------------- #
  h2load-exporter:
    build:
      context: ./monitoring/exporter
      dockerfile: Dockerfile
    image: http-testbed/h2load-exporter:latest
    container_name: h2load-exporter
    environment:
      HTTP_PORT: "9115"
      LIVE_DIR: "/results/live"
      WINDOW_S: "10"
    volumes:
      - ./results:/results:ro
    networks:
      - monitoring_net
    cpuset: "${CPUSET_SUPPORT:-8-11}"
    cpus: "0.5"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9115/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # 5. cAdvisor: per-container CPU / memory from cgroups.
  # ------------------------------------------------------------------------- #
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    # cAdvisor needs privileged cgroup/sys access; no artificial limits so it
    # never throttles while collecting metrics.
    privileged: true
    # Host cgroup namespace. WSL2/Docker Desktop is cgroup v2, and by default a
    # container gets a PRIVATE cgroup namespace, so cAdvisor only sees its own
    # cgroup as "/" and reports ZERO per-container series (only id="/"). Joining
    # the host cgroup ns lets it see every sibling container's cgroup, which is
    # what makes the per-container CPU/mem series (and their compose-service
    # labels, enriched via the docker socket mounted below) appear at all.
    cgroup: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/lib/containerd:/var/lib/containerd:ro
    command:
      # - --docker_only=true
      - --housekeeping_interval=1s
    ports:
      - "8080:8080"
    networks:
      - monitoring_net
    cpus: "1.0"
    mem_limit: 512m
    # Monitoring plane off the SUT cores (see CPUSET_SUPPORT).
    cpuset: "${CPUSET_SUPPORT:-8-11}"
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # 6. Prometheus: scrapes cAdvisor (1s, server metrics) and the h2load-exporter
  #    (1s, live client metrics). h2load does not remote-write.
  # ------------------------------------------------------------------------- #
  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    user: root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long retention: must cover the full 150-run campaign + analysis.
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --query.lookback-delta=5m
      - --web.enable-admin-api
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_net
    cpuset: "${CPUSET_SUPPORT:-8-11}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # 7. Grafana: auto-provisioned datasource + dashboard.
  # ------------------------------------------------------------------------- #
  grafana:
    image: grafana/grafana:13.0.8
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/http-testbed-live.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring_net
    cpuset: "${CPUSET_SUPPORT:-8-11}"
    restart: unless-stopped

# --------------------------------------------------------------------------- #
# Networks: separate the client-facing link (edge_net, which is emulated)
# from the server link (backend_net) and the observability plane
# (monitoring_net). Fixed subnets make interface auto-detection deterministic.
# --------------------------------------------------------------------------- #
networks:
  edge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  monitoring_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
