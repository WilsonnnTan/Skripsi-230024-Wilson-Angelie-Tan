# =============================================================================
# Prometheus configuration
# =============================================================================
# - Scrapes cAdvisor at 1s resolution so short-lived CPU/memory peaks during
#   the sustained phase are not averaged away.
# - RECEIVES k6 metrics through the remote-write receiver on /api/v1/write
#   (enabled by --web.enable-remote-write-receiver in docker-compose.yml).
#
# k6 labels (protocol, scenario, repetition, phase, ...) become Prometheus
# labels automatically, which is what allows the sustained-only PromQL filters
# used by scripts/export_results.sh.
# =============================================================================
global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: cadvisor
    scrape_interval: 1s
    scrape_timeout: 1s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
